name: Credit Risk Model CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Adjust to match your project

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Temporary Mock Data
      run: |
        python scripts/generate_dummy_data.py

    - name: Run Unit Tests (Pytest)
      run: |
        pytest tests/

    - name: Run Data Drift Checks (EvidentlyAI)
      run: |
        python scripts/check_drift.py

    - name: Upload Drift Report as Artifact
      # This step uploads the HTML report so you can view it even if the build fails
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: evidently-drift-report
        path: drift_report.html
