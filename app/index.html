<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Risk Decision Engine</title>
  <style>
    :root {
      --bg: #f7fafc;
      --card: #ffffff;
      --text: #1a202c;
      --border: #e2e8f0;
      --button: #1f6feb;
      --button-text: #ffffff;
      --result-bg: #0f172a;
      --result-text: #e2e8f0;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }
    textarea {
      width: 100%;
      min-height: 230px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: Consolas, monospace;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      border: 0;
      border-radius: 6px;
      background: var(--button);
      color: var(--button-text);
      padding: 10px 14px;
      cursor: pointer;
    }
    pre {
      margin-top: 14px;
      background: var(--result-bg);
      color: var(--result-text);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Credit Risk Decision Engine</h1>
    <p>POST JSON to <code>/predict</code> using format <code>{"root": {...}}</code>.</p>
    <textarea id="payload">{
  "root": {
    "loan_amnt": 10000,
    "term": "36 months",
    "int_rate": 12.5,
    "purpose": "debt_consolidation",
    "annual_inc": 75000
  }
}</textarea>
    <br />
    <button id="predict-btn" type="button">Predict</button>
    <pre id="result">No response yet.</pre>
  </main>

  <script>
    const btn = document.getElementById("predict-btn");
    const payload = document.getElementById("payload");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      try {
        const body = JSON.parse(payload.value);
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = String(err);
      }
    });
  </script>
</body>
</html>
